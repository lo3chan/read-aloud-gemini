<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud Options</title>
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/options.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/phonon-bridge.js"></script>
  <script src="js/edge-tts-bridge.js"></script>
  <script src="js/tts-engines.js"></script>
  <script src="js/options.js"></script>
</head>
<body>
  <div class="container-fluid">
    <button type="button" class="close" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
    <h2>
      <span data-i18n="options_heading"></span>
      <a href="advanced-options.html" id="expand-button" class="material-icons"><svg><use href="img/icons.svg#open_in_new"/></svg></a>
    </h2>

    <div class="layout">
      <div>
        <span data-i18n="options_voice_label"></span>
      </div>
      <div class="voice-selector">
        <select id="voices" class="form-control">
        </select>
      </div>

      <div>
        <span data-i18n="options_rate_label"></span>
        <button id="rate-edit-button" type="button" class="btn btn-sm btn-light">
          <i class="material-icons"><svg><use href="img/icons.svg#mode_edit"/></svg></i>
        </button>
        <button id="rate-info-button" class="setting-info-button" type="button" aria-expanded="false" aria-controls="rate-warning" hidden>
          <i class="material-icons" aria-hidden="true"><svg><use href="img/icons.svg#info_outline"/></svg></i>
        </button>
      </div>
      <div>
        <div id="rate" class="slider" data-min="-1" data-max="1" data-steps="40" data-pow="3"></div>
        <div id="rate-input-div">
          <input id="rate-input" class="form-control" type="text" maxlength="5" />
        </div>
        <div id="rate-warning" class="setting-info-popup" role="region" aria-labelledby="rate-info-button" data-i18n="options_rate_warning" hidden></div>
      </div>

      <div>
        <span data-i18n="options_volume_label"></span>
      </div>
      <div>
        <div id="volume" class="slider" data-min="0.2" data-max="1" data-steps="40"></div>
      </div>

      <div>
        <span data-i18n="options_show_highlighting"></span>
      </div>
      <select id="show-highlighting" class="form-control">
        <option value="0" data-i18n="options_highlighting_off"></option>
        <option value="1" data-i18n="options_highlighting_popup"></option>
        <option value="2" data-i18n="options_highlighting_window"></option>
        <option value="3" data-i18n="options_highlighting_reader"></option>
      </select>

      <div class="audio-playback-visible">
        <span data-i18n="options_audio_playback"></span>
      </div>
      <select id="audio-playback" class="form-control audio-playback-visible">
        <option value="false" data-i18n="options_audio_playback_standalone"></option>
        <option value="true" data-i18n="options_audio_playback_embedded"></option>
      </select>

      <div>
        <span>Backend</span>
      </div>
      <select id="gemini-backend" class="form-control">
        <option value="gemini-api">Gemini API Key</option>
        <option value="portal">Google Cloud Portal (No API Key)</option>
        <option value="google-translate">Google Translate (Free, No Key)</option>
        <option value="phonon-webgpu">Local WebGPU — Phonon 31M (English, No Key)</option>
        <option value="edge-tts">Edge Neural TTS (Free, No Key)</option>
        <option value="cloud-tts">Google Cloud TTS API Key</option>
      </select>

      <div id="gemini-key-label">
        <span>API Key</span>
      </div>
      <div id="gemini-key-control">
        <input id="gemini-api-key" type="password" class="form-control" placeholder="AIza..." />
      </div>

      <div id="portal-auth-label" style="display: none;">
        <span>Portal</span>
      </div>
      <div id="portal-auth-control" style="display: none;">
        <button type="button" id="portal-auth-btn" class="btn btn-sm btn-outline-info">Authorize Portal</button>
        <small id="portal-token-status" class="ml-2 text-muted"></small>
      </div>

      <div>
        <span>Model</span>
      </div>
      <select id="gemini-model" class="form-control">
        <option value="gemini-3.8-flash-lite-tts">Gemini 3.8 Flash Lite TTS (Recommended)</option>
        <option value="gemini-3.8-flash-tts">Gemini 3.8 Flash TTS</option>
        <option value="tts">tts (Auto TTS Alias)</option>
        <option value="gemini-3.1-flash-tts-preview">Gemini 3.1 Flash TTS (preview)</option>
        <option value="gemini-2.5-flash-preview-tts">Gemini 2.5 Flash TTS (preview)</option>
        <option value="gemini-2.5-pro-preview-tts">Gemini 2.5 Pro TTS (preview)</option>
      </select>

      <div>
        <span>Locale</span>
      </div>
      <select id="gemini-lang" class="form-control">
        <option value="en-gb">English (United Kingdom) - en-gb</option>
        <option value="en-us">English (United States) - en-us</option>
        <option value="en-au">English (Australia) - en-au</option>
        <option value="en-in">English (India) - en-in</option>
        <option value="es-es">Spanish (Spain) - es-es</option>
        <option value="es-us">Spanish (US) - es-us</option>
        <option value="fr-fr">French (France) - fr-fr</option>
        <option value="de-de">German (Germany) - de-de</option>
        <option value="it-it">Italian (Italy) - it-it</option>
        <option value="ja-jp">Japanese (Japan) - ja-jp</option>
        <option value="ko-kr">Korean (South Korea) - ko-kr</option>
        <option value="pt-br">Portuguese (Brazil) - pt-br</option>
        <option value="zh-cn">Chinese (Mandarin) - zh-cn</option>
      </select>

      <div>
        <span>Instructions</span>
      </div>
      <input id="gemini-prompt" type="text" class="form-control" placeholder="Speak with a natural, warm Scottish accent." />
    </div>

    <div class="form-group buttons">
      <button type="button" id="test-voice" class="btn btn-info">
        <div class="spinner"></div>
        <span data-i18n="options_test_button"></span>
      </button>
      <button type="button" id="reset" class="btn btn-warning" data-i18n="options_reset_button"></button>
      <button type="button" id="open-diagnostics" class="btn btn-secondary">Diagnostics</button>
      <span class="green-check">
        <i class="material-icons"><svg><use href="img/icons.svg#check"/></svg></i>
      </span>
    </div>

    <div class="form-group update-bar">
      <small id="ext-version" class="text-muted"></small>
      <button type="button" id="check-updates-btn" class="btn btn-sm btn-light">Check for Updates</button>
      <small id="update-status" class="text-muted"></small>
    </div>

    <div class="form-group">
      <small id="status" style="color: red"></small>
    </div>
  </div>
</body>
</html>
